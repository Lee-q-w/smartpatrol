name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend-build:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 类型检查（TypeScript）
        run: pnpm typecheck
      - name: 生产构建
        run: pnpm build

  backend-test:
    name: 后端验证（识别 / 报告 / 工单 / 助手 / RAG / 流式 / 配置）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - name: 安装中文字体（报告 PDF 渲染需要）
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-wqy-zenhei
      - name: 字体诊断（→ Step Summary）
        run: |
          {
            echo "## 字体诊断"
            echo '### 中文字体文件'
            ls -l /usr/share/fonts/opentype/noto/ 2>/dev/null || echo "noto 目录不存在"
            ls -l /usr/share/fonts/truetype/wqy/ 2>/dev/null || echo "wqy 目录不存在"
            echo '### fc-list 中文'
            fc-list :lang=zh 2>/dev/null | head -8 || echo "fc-list 不可用"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: 安装依赖
        run: uv sync
      - name: 库版本诊断（→ Step Summary）
        run: |
          {
            echo "## 库版本"
            uv run python -c "import reportlab, PIL; print('reportlab', reportlab.Version); print('Pillow', PIL.__version__)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 识别链路验证
        run: |
          set -o pipefail
          uv run python test_recognize.py 2>&1 | tee /tmp/t1.log || { { echo '## test_recognize 失败'; tail -30 /tmp/t1.log; } >> "$GITHUB_STEP_SUMMARY"; exit 1; }
      - name: 报告导出验证
        run: |
          set -o pipefail
          uv run python test_report_pdf.py 2>&1 | tee /tmp/t2.log || { { echo '## test_report_pdf 失败'; tail -40 /tmp/t2.log; } >> "$GITHUB_STEP_SUMMARY"; exit 1; }
      - name: 工单 PDF 验证
        run: |
          set -o pipefail
          uv run python test_handle_pdf.py 2>&1 | tee /tmp/t3.log || { { echo '## test_handle_pdf 失败'; tail -40 /tmp/t3.log; } >> "$GITHUB_STEP_SUMMARY"; exit 1; }
      - name: AI 助手接口验证
        run: |
          set -o pipefail
          uv run python test_agent.py 2>&1 | tee /tmp/t4.log || { { echo '## test_agent 失败'; tail -30 /tmp/t4.log; } >> "$GITHUB_STEP_SUMMARY"; exit 1; }
      - name: RAG 知识库验证
        run: |
          set -o pipefail
          uv run python test_rag.py 2>&1 | tee /tmp/t6.log || { { echo '## test_rag 失败'; tail -30 /tmp/t6.log; } >> "$GITHUB_STEP_SUMMARY"; exit 1; }
      - name: 助手流式验证
        run: |
          set -o pipefail
          uv run python test_agent_stream.py 2>&1 | tee /tmp/t7.log || { { echo '## test_agent_stream 失败'; tail -40 /tmp/t7.log; } >> "$GITHUB_STEP_SUMMARY"; exit 1; }
      - name: 报告 AI 总结验证
        run: |
          set -o pipefail
          uv run python test_summary.py 2>&1 | tee /tmp/t12.log || { { echo '## test_summary 失败'; tail -30 /tmp/t12.log; } >> "$GITHUB_STEP_SUMMARY"; exit 1; }
      - name: 热点自适应验证
        run: |
          set -o pipefail
          uv run python test_hotspot.py 2>&1 | tee /tmp/t11.log || { { echo '## test_hotspot 失败'; tail -30 /tmp/t11.log; } >> "$GITHUB_STEP_SUMMARY"; exit 1; }
      - name: 双车协同验证
        run: |
          set -o pipefail
          uv run python test_fleet.py 2>&1 | tee /tmp/t10.log || { { echo '## test_fleet 失败'; tail -30 /tmp/t10.log; } >> "$GITHUB_STEP_SUMMARY"; exit 1; }
      - name: 雨天自适应验证
        run: |
          set -o pipefail
          uv run python test_weather.py 2>&1 | tee /tmp/t9.log || { { echo '## test_weather 失败'; tail -30 /tmp/t9.log; } >> "$GITHUB_STEP_SUMMARY"; exit 1; }
      - name: 模型配置 API 验证
        run: |
          set -o pipefail
          uv run python test_config_api.py 2>&1 | tee /tmp/t5.log || { { echo '## test_config_api 失败'; tail -30 /tmp/t5.log; } >> "$GITHUB_STEP_SUMMARY"; exit 1; }

  mcp-test:
    name: MCP Server 验证（工具清单 / 状态桥 / 指令通道）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: 安装依赖
        run: uv sync
      - name: 启动后端与 MCP Server
        run: |
          nohup uv run python main.py > /tmp/backend.log 2>&1 &
          nohup uv run python mcp_server.py > /tmp/mcp.log 2>&1 &
          sleep 6
          curl -sf http://127.0.0.1:8788/api/health > /dev/null || { cat /tmp/backend.log; exit 1; }
          curl -sf -o /dev/null http://127.0.0.1:8790/mcp || true   # 探活（405 也算在线）
      - name: MCP 端到端验证
        run: |
          set -o pipefail
          uv run python test_mcp.py 2>&1 | tee /tmp/t8.log || { { echo '## test_mcp 失败'; tail -30 /tmp/t8.log; } >> "$GITHUB_STEP_SUMMARY"; exit 1; }

  deploy-pages:
    name: 部署在线演示（gh-pages 自动同步）
    needs: [frontend-build]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: 安装依赖并构建
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: 推送 dist 到 gh-pages
        run: |
          cd dist
          git init -b gh-pages -q
          git config user.name "ci-bot"
          git config user.email "ci@smartpatrol.local"
          printf '# 智巡 SmartPatrol 在线演示（CI 自动部署）\n' > README.md
          touch .nojekyll
          git add -A
          git commit -q -m "deploy: CI 自动部署 master@${GITHUB_SHA::7}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git push -qf origin gh-pages

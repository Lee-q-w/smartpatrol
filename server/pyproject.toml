[project]
name = "smartpatrol-server"
version = "1.0.0"
description = "智巡 AI 识别中心 FastAPI 薄后端"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "reportlab>=5.1.0",
    "pillow>=12.3.0",
    "websockets>=16.1.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pypdf>=6.21.2",
    "pytest>=9.1.1",
]
